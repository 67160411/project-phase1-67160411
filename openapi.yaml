openapi: 3.0.3

info:
  title: TaskFlow API
  version: 3.0.0
  description: |
    TaskFlow API สำหรับจัดการงานของผู้ใช้
    รองรับการอ่าน เพิ่ม แก้ไข และลบงาน
    รองรับการกรองตามหมวดหมู่ GraphQL และ Swagger
    รวมถึง External API ที่มี Retry, Timeout และ Fallback

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: General
    description: API ทั่วไป
  - name: Tasks
    description: API สำหรับจัดการงาน
  - name: External API
    description: API ภายนอกและระบบ Fallback
  - name: GraphQL
    description: GraphQL endpoint

paths:
  /:
    get:
      tags: [General]
      summary: ตรวจสอบสถานะระบบ
      operationId: getRoot
      responses:
        "200":
          description: เซิร์ฟเวอร์พร้อมใช้งาน
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: project-phase1-67160411 พร้อมใช้งาน
                  endpoints:
                    type: object
                    properties:
                      tasks:
                        type: string
                        example: /api/v1/tasks
                      externalTodo:
                        type: string
                        example: /api/external/todo
                      graphql:
                        type: string
                        example: /graphql
                      swagger:
                        type: string
                        example: /api-docs

  /api/v1/tasks:
    get:
      tags: [Tasks]
      summary: ดึงรายการงานทั้งหมด
      description: กรองงานด้วยชื่อหมวดหมู่หรือ category_id ได้
      operationId: getTasks
      parameters:
        - name: category
          in: query
          required: false
          description: ชื่อหมวดหมู่ (ไม่แยกตัวพิมพ์เล็กและใหญ่)
          schema:
            type: string
          example: Project
        - name: category_id
          in: query
          required: false
          description: รหัสหมวดหมู่ ต้องเป็นจำนวนเต็มบวก
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        "200":
          description: ดึงรายการงานสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message:
                    type: string
                    example: สำเร็จ
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaskListItem"
        "400":
          description: category_id ไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: INVALID_CATEGORY_ID
                  message: category_id ต้องเป็นจำนวนเต็มบวก
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [Tasks]
      summary: เพิ่มงานใหม่
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
            example:
              title: ทบทวนบทเรียนก่อนสอบ
              description: อ่านและสรุปเนื้อหา
              due_date: "2026-10-30"
              status: pending
              user_id: 2
              category_id: 1
      responses:
        "201":
          description: เพิ่มงานสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskMutationResponse"
              example:
                message: เพิ่มข้อมูลสำเร็จ
                data:
                  id: 10
                  title: ทบทวนบทเรียนก่อนสอบ
                  description: อ่านและสรุปเนื้อหา
                  due_date: "2026-10-30T00:00:00.000Z"
                  status: pending
                  user_id: 2
                  category_id: 1
                notification:
                  success: true
                  message: Notification logged successfully
        "400":
          description: ข้อมูลไม่ครบหรือ ID ไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingFields:
                  summary: ข้อมูลที่จำเป็นไม่ครบ
                  value:
                    error:
                      code: MISSING_FIELDS
                      message: กรุณาระบุ title, due_date, status, user_id และ category_id ให้ครบถ้วน
                invalidForeignKey:
                  summary: ID อ้างอิงไม่ถูกต้อง
                  value:
                    error:
                      code: INVALID_FOREIGN_KEY
                      message: user_id และ category_id ต้องเป็นจำนวนเต็มบวก
        "404":
          description: ไม่พบผู้ใช้หรือหมวดหมู่ที่อ้างอิง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: FOREIGN_KEY_NOT_FOUND
                  message: ไม่พบข้อมูล user_id หรือ category_id ที่อ้างอิงในระบบ
        "409":
          $ref: "#/components/responses/DuplicateTaskTitle"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: รหัสงาน ต้องเป็นจำนวนเต็มบวก
        schema:
          type: integer
          minimum: 1
        example: 1

    get:
      tags: [Tasks]
      summary: ดึงรายละเอียดงานตาม ID
      operationId: getTaskById
      responses:
        "200":
          description: ดึงข้อมูลงานสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message:
                    type: string
                    example: สำเร็จ
                  data:
                    $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags: [Tasks]
      summary: แก้ไขงานทั้งรายการ
      description: ต้องส่ง title, due_date, status, user_id และ category_id ให้ครบ
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "200":
          description: แก้ไขงานสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskMutationResponse"
        "400":
          description: ID หรือข้อมูลที่ส่งมาไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ไม่พบงานหรือข้อมูลอ้างอิง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/DuplicateTaskTitle"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags: [Tasks]
      summary: แก้ไขงานบางฟิลด์
      description: |
        ส่งเฉพาะฟิลด์ที่ต้องการแก้ไขได้ ได้แก่ title, description,
        due_date, status, user_id และ category_id
      operationId: patchTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatchInput"
            example:
              status: done
      responses:
        "200":
          description: แก้ไขงานสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskMutationResponse"
        "400":
          description: ไม่มีข้อมูลที่แก้ไขได้ หรือฟิลด์/ID ไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noUpdates:
                  summary: ไม่ได้ส่งข้อมูล
                  value:
                    error:
                      code: NO_UPDATES
                      message: กรุณาระบุข้อมูลที่ต้องการแก้ไข
                invalidFields:
                  summary: ฟิลด์ไม่อนุญาต
                  value:
                    error:
                      code: INVALID_FIELDS
                      message: ไม่อนุญาตให้แก้ไขฟิลด์ที่ระบุ
        "404":
          description: ไม่พบงานหรือข้อมูลอ้างอิง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/DuplicateTaskTitle"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags: [Tasks]
      summary: ลบงานตาม ID
      operationId: deleteTask
      responses:
        "200":
          description: ลบงานสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message:
                    type: string
                    example: ลบข้อมูลสำเร็จ
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
              example:
                message: ลบข้อมูลสำเร็จ
                data:
                  id: 1
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/external/todo:
    get:
      tags: [External API]
      summary: เรียก External Todo API
      description: |
        เรียกใช้ External API ผ่าน service โดยใช้ EXTERNAL_API_URL
        หากไม่ได้ตั้งค่า จะใช้ https://jsonplaceholder.typicode.com/todos/1
        กำหนด timeout 3 วินาทีต่อครั้ง และ retry สูงสุด 2 ครั้ง
        (รวมการเรียกได้สูงสุด 3 ครั้ง) เมื่อเกิดข้อผิดพลาดที่ retry ได้
        หากทุกครั้งล้มเหลว route จะตอบ HTTP 200 พร้อมข้อมูล fallback
      operationId: getExternalTodo
      responses:
        "200":
          description: ได้ข้อมูลจากบริการภายนอกหรือข้อมูลสำรอง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalTodoResponse"
              examples:
                externalSuccess:
                  summary: ได้ข้อมูลจากบริการภายนอก
                  value:
                    message: ดึงข้อมูลจาก External API สำเร็จ
                    success: true
                    source: external-api
                    data:
                      userId: 1
                      id: 1
                      title: delectus aut autem
                      completed: false
                fallback:
                  summary: ใช้ข้อมูลสำรอง
                  value:
                    message: External API ไม่พร้อมใช้งาน ใช้ข้อมูลสำรองแทน
                    success: true
                    source: fallback
                    warning: ข้อมูลนี้เป็นข้อมูลสำรอง ไม่ใช่ข้อมูลสดจาก API
                    data:
                      userId: 1
                      id: 1
                      title: ตัวอย่างข้อมูลสำรอง
                      completed: false

  /graphql:
    get:
      tags: [GraphQL]
      summary: เปิด GraphiQL สำหรับทดลอง Query
      description: Express GraphQL เปิด GraphiQL สำหรับทดลอง query ผ่านเบราว์เซอร์
      operationId: graphqlGet
      responses:
        "200":
          description: หน้า GraphiQL หรือผลลัพธ์ GraphQL
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: object
        "400":
          description: Request หรือ query ไม่ถูกต้อง

    post:
      tags: [GraphQL]
      summary: ส่ง GraphQL Query หรือ Mutation
      operationId: graphqlPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  example: query { __typename }
                variables:
                  type: object
                  additionalProperties: true
                operationName:
                  type: string
      responses:
        "200":
          description: ผลลัพธ์ GraphQL ซึ่งอาจมี data หรือ errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    nullable: true
                    additionalProperties: true
                  errors:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "400":
          description: Request หรือ JSON ไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  responses:
    InternalServerError:
      description: เกิดข้อผิดพลาดภายในระบบ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL_SERVER_ERROR
              message: เกิดข้อผิดพลาดที่ไม่คาดคิดภายในระบบ

    DuplicateTaskTitle:
      description: ชื่องานซ้ำกับข้อมูลในระบบ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: DUPLICATE_TASK_TITLE
              message: ชื่องานนี้มีอยู่แล้ว กรุณาใช้ชื่ออื่น

    InvalidId:
      description: ID ต้องเป็นจำนวนเต็มบวก
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INVALID_ID
              message: id ต้องเป็นจำนวนเต็มบวก

    TaskNotFound:
      description: ไม่พบงานตาม ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NOT_FOUND
              message: ไม่พบข้อมูลงาน

  schemas:
    TaskStatus:
      type: string
      description: สถานะงานที่ระบบใช้งานตามข้อมูลปัจจุบัน ทั้งนี้ route ไม่ได้ตรวจสอบ enum นี้โดยตรง
      enum:
        - pending
        - in_progress
        - done
      example: pending

    TaskInput:
      type: object
      required:
        - title
        - due_date
        - status
        - user_id
        - category_id
      properties:
        title:
          type: string
          minLength: 1
          example: ทบทวนบทเรียนก่อนสอบ
        description:
          type: string
          nullable: true
          example: อ่านและสรุปเนื้อหา
        due_date:
          type: string
          description: วันที่กำหนดส่ง แนะนำรูปแบบ YYYY-MM-DD
          example: "2026-10-30"
        status:
          type: string
          description: ต้องส่งค่า แต่ route ไม่ได้บังคับ enum ของสถานะ
          example: pending
        user_id:
          type: integer
          minimum: 1
          example: 2
        category_id:
          type: integer
          minimum: 1
          example: 1

    TaskPatchInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        due_date:
          type: string
          description: วันที่กำหนดส่ง
        status:
          type: string
        user_id:
          type: integer
          minimum: 1
        category_id:
          type: integer
          minimum: 1

    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        due_date:
          type: string
          format: date-time
        status:
          type: string
        user_id:
          type: integer
        category_id:
          type: integer
        created_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: true

    TaskListItem:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          properties:
            category_name:
              type: string
              nullable: true

    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          properties:
            user:
              type: object
              nullable: true
              properties:
                id:
                  type: integer
                name:
                  type: string
                email:
                  type: string
                  format: email
            category:
              type: object
              nullable: true
              properties:
                id:
                  type: integer
                name:
                  type: string
                description:
                  type: string
                  nullable: true

    TaskMutationResponse:
      type: object
      required: [message, data, notification]
      properties:
        message:
          type: string
        data:
          $ref: "#/components/schemas/Task"
        notification:
          type: object
          description: ผลการบันทึก Notification ลง Console; ไม่ได้ส่งอีเมลหรือ Push Notification จริง
          properties:
            success:
              type: boolean
            message:
              type: string
          additionalProperties: true

    ExternalTodoResponse:
      type: object
      required: [message, success, data]
      properties:
        message:
          type: string
        success:
          type: boolean
        source:
          type: string
          enum:
            - external-api
            - fallback
        warning:
          type: string
        data:
          type: object
          properties:
            userId:
              type: integer
            id:
              type: integer
            title:
              type: string
            completed:
              type: boolean
          additionalProperties: true
      additionalProperties: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
