openapi: 3.0.3

info:
  title: Task Management API
  version: 1.0.0
  description: |
    API สำหรับจัดการงานในโครงงาน
    ครอบคลุมการอ่าน เพิ่ม แก้ไข และลบข้อมูล Tasks
    รวมถึงการเรียกใช้ External API โดยมีระบบ retry, timeout และ fallback

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: General
    description: API ทั่วไป
  - name: Tasks
    description: API สำหรับจัดการงาน
  - name: External API
    description: การเรียกใช้ API ภายนอกพร้อมกลไก fallback

paths:
  /:
    get:
      tags:
        - General
      summary: ตรวจสอบสถานะ API
      description: ตรวจสอบว่าเซิร์ฟเวอร์ทำงานอยู่หรือไม่
      operationId: getRoot
      responses:
        "200":
          description: API พร้อมใช้งาน
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: project-phase1-67160411 พร้อมใช้งาน
                  endpoints:
                    type: object
                    properties:
                      tasks:
                        type: string
                        example: /api/v1/tasks
                      externalTodo:
                        type: string
                        example: /api/external/todo
                      graphql:
                        type: string
                        example: /graphql
                      swagger:
                        type: string
                        example: /api-docs
              example:
                message: project-phase1-67160411 พร้อมใช้งาน
                endpoints:
                  tasks: /api/v1/tasks
                  externalTodo: /api/external/todo
                  graphql: /graphql
                  swagger: /api-docs
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/tasks:
    get:
      tags:
        - Tasks
      summary: ดึงรายการงานทั้งหมด
      description: สามารถกรองรายการงานตามชื่อหมวดหมู่หรือรหัสหมวดหมู่ได้
      operationId: getTasks
      parameters:
        - name: category
          in: query
          required: false
          description: ชื่อหมวดหมู่ที่ต้องการกรอง
          schema:
            type: string
          example: Project
        - name: category_id
          in: query
          required: false
          description: รหัสหมวดหมู่ที่ต้องการกรอง
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        "200":
          description: ดึงรายการงานสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: สำเร็จ
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaskListItem"
              example:
                message: สำเร็จ
                data:
                  - id: 1
                    title: ทำ project-phase1
                    description: ทำให้เสร็จภายในกำหนดเวลา
                    category: Project
                    category_name: Project
                    due_date: "2026-08-01T00:00:00.000Z"
                    status: in_progress
                    user_id: 1
                    category_id: 1
                    created_at: "2026-07-01T10:00:00.000Z"
        "400":
          description: พารามิเตอร์ไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: INVALID_PARAMETER
                  message: category_id ต้องเป็นตัวเลขจำนวนเต็ม
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Tasks
      summary: เพิ่มงานใหม่
      description: สร้างงานใหม่โดยต้องระบุข้อมูลที่จำเป็นให้ครบ
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
            example:
              title: ทำรายงาน API
              description: จัดทำเอกสาร API
              due_date: "2026-10-30"
              status: pending
              user_id: 1
              category_id: 1
      responses:
        "201":
          description: เพิ่มข้อมูลสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: เพิ่มข้อมูลสำเร็จ
                  data:
                    $ref: "#/components/schemas/TaskWriteResponse"
              example:
                message: เพิ่มข้อมูลสำเร็จ
                data:
                  id: 10
                  title: ทำรายงาน API
                  description: จัดทำเอกสาร API
                  category: Project
                  due_date: "2026-10-30T00:00:00.000Z"
                  status: pending
                  user_id: 1
                  category_id: 1
                  created_at: "2026-10-24T10:00:00.000Z"
        "400":
          description: ข้อมูลที่จำเป็นไม่ครบถ้วน หรือรูปแบบข้อมูลไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: MISSING_FIELDS
                  message: กรุณาระบุ title, due_date, status, user_id และ category_id ให้ครบถ้วน
        "404":
          description: ไม่พบผู้ใช้หรือหมวดหมู่ที่อ้างอิง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: FOREIGN_KEY_NOT_FOUND
                  message: ไม่พบข้อมูล user_id หรือ category_id ที่อ้างอิงในระบบ
        "409":
          $ref: "#/components/responses/DuplicateTaskTitle"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: รหัสงาน ต้องเป็นจำนวนเต็มตั้งแต่ 1 ขึ้นไป
        schema:
          type: integer
          minimum: 1
        example: 1

    get:
      tags:
        - Tasks
      summary: ดึงข้อมูลงานตาม ID
      description: ดึงรายละเอียดงานพร้อมข้อมูลผู้ใช้และหมวดหมู่
      operationId: getTaskById
      responses:
        "200":
          description: ดึงข้อมูลงานสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: สำเร็จ
                  data:
                    $ref: "#/components/schemas/TaskDetail"
        "400":
          description: รูปแบบ ID ไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: INVALID_ID
                  message: ID ต้องเป็นตัวเลขจำนวนเต็มที่มากกว่าหรือเท่ากับ 1
        "404":
          description: ไม่พบงานที่ระบุ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: NOT_FOUND
                  message: ไม่พบข้อมูลงาน
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags:
        - Tasks
      summary: แก้ไขข้อมูลงานทั้งหมด
      description: แทนที่ข้อมูลหลักของงานตาม ID โดยต้องส่งข้อมูลที่จำเป็นให้ครบ
      operationId: replaceTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
            example:
              title: ทำรายงาน API ฉบับแก้ไข
              description: ปรับปรุงเอกสาร API
              due_date: "2026-10-31"
              status: in_progress
              user_id: 1
              category_id: 1
      responses:
        "200":
          description: แก้ไขข้อมูลสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: แก้ไขข้อมูลสำเร็จ
                  data:
                    $ref: "#/components/schemas/TaskWriteResponse"
        "400":
          description: ID หรือข้อมูลที่ส่งมาไม่ถูกต้อง หรือข้อมูลที่จำเป็นไม่ครบ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: MISSING_FIELDS
                  message: กรุณาระบุ title, due_date, status, user_id และ category_id ให้ครบถ้วน
        "404":
          description: ไม่พบงาน ผู้ใช้ หรือหมวดหมู่ที่อ้างอิง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: NOT_FOUND
                  message: ไม่พบข้อมูลงาน
        "409":
          $ref: "#/components/responses/DuplicateTaskTitle"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags:
        - Tasks
      summary: แก้ไขข้อมูลงานบางส่วน
      description: แก้ไขเฉพาะฟิลด์ที่ส่งมาใน Request Body
      operationId: updateTaskPartially
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatchInput"
            example:
              status: done
      responses:
        "200":
          description: แก้ไขข้อมูลงานสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: แก้ไขข้อมูลงานสำเร็จ
                  data:
                    $ref: "#/components/schemas/TaskWriteResponse"
        "400":
          description: ไม่ได้ระบุข้อมูลที่ต้องการแก้ไข หรือข้อมูลไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: NO_UPDATES
                  message: กรุณาระบุข้อมูลที่ต้องการแก้ไข
        "404":
          description: ไม่พบงาน ผู้ใช้ หรือหมวดหมู่ที่อ้างอิง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: NOT_FOUND
                  message: ไม่พบข้อมูลงาน
        "409":
          $ref: "#/components/responses/DuplicateTaskTitle"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Tasks
      summary: ลบงานตาม ID
      description: ลบงานที่มี ID ตรงกับค่าที่ระบุ
      operationId: deleteTask
      responses:
        "200":
          description: ลบข้อมูลสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: ลบข้อมูลสำเร็จ
              example:
                message: ลบข้อมูลสำเร็จ
        "400":
          description: รูปแบบ ID ไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: INVALID_ID
                  message: ID ต้องเป็นตัวเลขจำนวนเต็มที่มากกว่าหรือเท่ากับ 1
        "404":
          description: ไม่พบงานที่ระบุ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: NOT_FOUND
                  message: ไม่พบข้อมูลงาน
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/external/todo:
    get:
      tags:
        - External API
      summary: ดึงข้อมูล Todo จาก External API
      description: |
        เรียก External API ผ่าน service ซึ่งมี retry และ timeout
        หากเรียกบริการภายนอกไม่สำเร็จ ระบบอาจคืนข้อมูล fallback
      operationId: getExternalTodo
      responses:
        "200":
          description: ได้ข้อมูลจาก External API หรือข้อมูลสำรอง
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                  success:
                    type: boolean
                  source:
                    type: string
                    enum:
                      - external_api
                      - fallback
                  warning:
                    type: string
                  data:
                    type: object
                    properties:
                      userId:
                        type: integer
                      id:
                        type: integer
                      title:
                        type: string
                      completed:
                        type: boolean
                    additionalProperties: true
                additionalProperties: true
              examples:
                externalSuccess:
                  summary: External API สำเร็จ
                  value:
                    message: ดึงข้อมูลจาก External API สำเร็จ
                    success: true
                    source: external_api
                    data:
                      userId: 1
                      id: 1
                      title: delectus aut autem
                      completed: false
                fallback:
                  summary: ใช้ข้อมูลสำรองเมื่อ External API ไม่พร้อมใช้งาน
                  value:
                    message: External API ไม่พร้อมใช้งาน ใช้ข้อมูลสำรองแทน
                    success: true
                    source: fallback
                    warning: ข้อมูลนี้เป็นข้อมูลสำรอง ไม่ใช่ข้อมูลสดจาก API
                    data:
                      userId: 1
                      id: 1
                      title: ตัวอย่างข้อมูลสำรอง
                      completed: false
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  responses:
    InternalServerError:
      description: เกิดข้อผิดพลาดภายในระบบ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL_SERVER_ERROR
              message: เกิดข้อผิดพลาดที่ไม่คาดคิดภายในระบบ

    DuplicateTaskTitle:
      description: ชื่อ Task ซ้ำกับข้อมูลที่มีอยู่ในระบบ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: DUPLICATE_TASK_TITLE
              message: ชื่อ Task นี้มีอยู่ในระบบแล้ว

  schemas:
    TaskStatus:
      type: string
      enum:
        - pending
        - in_progress
        - done
      example: pending

    TaskInput:
      type: object
      required:
        - title
        - due_date
        - status
        - user_id
        - category_id
      properties:
        title:
          type: string
          minLength: 1
          example: ทำรายงาน API
        description:
          type: string
          nullable: true
          example: จัดทำเอกสาร API
        due_date:
          type: string
          format: date
          example: "2026-10-30"
        status:
          $ref: "#/components/schemas/TaskStatus"
        user_id:
          type: integer
          minimum: 1
          example: 1
        category_id:
          type: integer
          minimum: 1
          example: 1

    TaskPatchInput:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          example: ทำรายงาน API ฉบับแก้ไข
        description:
          type: string
          nullable: true
          example: ปรับปรุงเอกสาร API
        due_date:
          type: string
          format: date
          example: "2026-10-31"
        status:
          $ref: "#/components/schemas/TaskStatus"
        user_id:
          type: integer
          minimum: 1
          example: 1
        category_id:
          type: integer
          minimum: 1
          example: 1

    Task:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: ทำ project-phase1
        description:
          type: string
          nullable: true
          example: ทำให้เสร็จภายในกำหนดเวลา
        due_date:
          type: string
          format: date-time
          example: "2026-10-28T17:00:00.000Z"
        status:
          $ref: "#/components/schemas/TaskStatus"
        user_id:
          type: integer
          example: 1
        category_id:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          example: "2026-07-01T10:00:00.000Z"

    TaskListItem:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          properties:
            category:
              type: string
              nullable: true
              example: Project
            category_name:
              type: string
              nullable: true
              example: Project

    TaskWriteResponse:
      type: object
      properties:
        id:
          type: integer
          example: 10
        title:
          type: string
          example: ทำรายงาน API
        description:
          type: string
          nullable: true
          example: จัดทำเอกสาร API
        category:
          type: string
          nullable: true
          example: Project
        due_date:
          type: string
          format: date-time
          example: "2026-10-30T00:00:00.000Z"
        status:
          $ref: "#/components/schemas/TaskStatus"
        user_id:
          type: integer
          example: 1
        category_id:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          example: "2026-10-24T10:00:00.000Z"

    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          properties:
            user:
              type: object
              nullable: true
              properties:
                id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: Example User
                email:
                  type: string
                  format: email
                  example: user@example.com
            category:
              type: object
              nullable: true
              properties:
                id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: Project
                description:
                  type: string
                  nullable: true
                  example: หมวดหมู่สำหรับงานโครงการ

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: ไม่พบข้อมูลงาน
